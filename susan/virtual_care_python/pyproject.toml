[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "susan-virtual-care-eda"
version = "0.1.0"
description = "Reusable virtual-care EDA for the DIIG Adyn project"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
database = ["psycopg[binary]>=3.1", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
include = ["virtual_care_pkg*"]
